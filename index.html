<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="QPlan: practice management for town planners. Jobs, statutory deadlines in business days, documents, time and invoices in one place." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QPlan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>QPlan</title>
    <script>
      // Set the theme before the page draws, so there is no flash of the wrong one.
      // The job summary page that clients open is always light.
      (function () {
        var choice = 'light'
        try { choice = localStorage.getItem('qplan_theme') || 'light' } catch (e) {}
        var summary = location.pathname.indexOf('/summary/') === 0
        var dark = !summary && (choice === 'dark' || (choice === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        var bar = document.querySelector('meta[name="theme-color"]')
        if (bar) bar.setAttribute('content', dark ? '#151d1a' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
